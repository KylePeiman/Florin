<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalshi Sniper</title>
  <style>
    /* ── reset + base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:       #0d1117;
      --surface:  #161b22;
      --glass:    rgba(255,255,255,0.05);
      --border:   rgba(255,255,255,0.08);
      --text:     #e6edf3;
      --muted:    #7d8590;
      --accent:   #58a6ff;
      --green:    #3fb950;
      --red:      #f85149;
      --orange:   #d29922;
      --radius:   10px;
    }
    html, body { min-height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; }

    /* ── header ── */
    header { padding: 16px 24px 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    header h1 { font-size: 1.2rem; font-weight: 600; letter-spacing: -.02em; flex: 1; min-width: 120px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; color: var(--muted); background: var(--glass); border: 1px solid var(--border); border-radius: 99px; padding: 3px 10px; }
    .refresh-btn { background: var(--glass); border: 1px solid var(--border); color: var(--muted); border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 13px; transition: color .15s; }
    .refresh-btn:hover { color: var(--text); }

    /* ── layout ── */
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px 48px; }

    /* ── mode tabs (Live / Sim) ── */
    .mode-bar { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 20px 0 0; }
    .mode-tab { background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 500; padding: 8px 16px; cursor: pointer; border-radius: var(--radius) var(--radius) 0 0; transition: color .15s, background .15s; }
    .mode-tab:hover { color: var(--text); background: var(--glass); }
    .mode-tab.active { color: var(--text); background: var(--glass); border: 1px solid var(--border); border-bottom: 1px solid var(--surface); }

    /* ── cards ── */
    .card { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px; }
    .card-title { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

    /* ── metric grid ── */
    .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .metric { background: var(--glass); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
    .metric .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .metric .value { font-size: 1.25rem; font-weight: 600; line-height: 1.2; }
    .metric .sub { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .pos { color: var(--green); } .neg { color: var(--red); } .neutral { color: var(--orange); }

    /* ── tables ── */
    .tbl-wrap { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { background: var(--surface); color: var(--muted); font-weight: 600; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 8px 12px; text-align: left; white-space: nowrap; }
    td { padding: 8px 12px; border-top: 1px solid var(--border); white-space: nowrap; }
    tr:hover td { background: var(--glass); }

    /* ── status pills ── */
    .pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
    .pill-running { background: rgba(63,185,80,.15); color: var(--green); }
    .pill-stopped { background: rgba(125,133,144,.12); color: var(--muted); }
    .pill-won     { background: rgba(63,185,80,.15);  color: var(--green); }
    .pill-lost    { background: rgba(248,81,73,.15);  color: var(--red); }
    .pill-voided  { background: rgba(210,153,34,.15); color: var(--orange); }
    .pill-pool    { background: rgba(88,166,255,.15); color: var(--accent); }

    /* ── banner ── */
    .banner { padding: 10px 16px; border-radius: var(--radius); font-size: 13px; margin-bottom: 16px; }
    .banner-warn { background: rgba(210,153,34,.1); border: 1px solid rgba(210,153,34,.25); color: var(--orange); }

    /* ── collapsible trade rows ── */
    .trade-row { cursor: pointer; user-select: none; }
    .trade-row:hover td { background: rgba(88,166,255,.05); }
    .trade-detail { background: var(--surface); }
    .trade-detail td { padding: 0 !important; border: none !important; }
    .trade-detail-inner { padding: 10px 20px 14px; }
    .trade-detail-inner table { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .expand-icon { display: inline-block; transition: transform .2s; font-size: 10px; margin-right: 6px; color: var(--muted); }
    .trade-row.open .expand-icon { transform: rotate(90deg); }

    /* ── canvas charts ── */
    .chart-wrap { margin: 12px 0 4px; }
    canvas { display: block; width: 100%; border-radius: 6px; }

    /* ── section divider ── */
    .divider { height: 1px; background: var(--border); margin: 20px 0; }

    /* ── no-data state ── */
    .no-data { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }

    /* ── caption ── */
    .caption { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

    /* ── mobile ── */
    @media (max-width: 640px) {
      .metrics { grid-template-columns: 1fr 1fr; }
      .hide-mobile { display: none !important; }
      header { padding: 12px 16px 0; }
      .container { padding: 0 12px 32px; }
      td, th { padding: 6px 8px; }
      .metric .value { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>⚡ Kalshi Sniper</h1>
  <div class="header-right">
    <span id="refresh-countdown" class="badge">—</span>
    <button class="refresh-btn" onclick="manualRefresh()">↻ Refresh</button>
  </div>
</header>

<div class="mode-bar" style="margin-left:24px;margin-right:24px">
  <button class="mode-tab active" data-mode="live" onclick="setViewMode('live')">Live</button>
  <button class="mode-tab" data-mode="sim" onclick="setViewMode('sim')">Simulated</button>
</div>

<div class="container" style="padding-top:20px">

  <!-- warn banner -->
  <div id="dash-banner" class="banner banner-warn" style="display:none">
    No data — run <code>python scripts/export_dashboard_data.py</code> to generate <code>docs/data.json</code>.
  </div>
  <p id="dash-ts" class="caption" style="margin-bottom:12px;display:none"></p>

  <!-- portfolio hero -->
  <div id="portfolio-hero" style="display:none">
    <div class="metrics" id="hero-metrics"></div>
    <div class="divider"></div>
  </div>

  <!-- pool summary -->
  <div id="dash-pools" style="display:none">
    <div class="card-title">Worker Pools</div>
    <div id="pools-all"></div>
    <div class="divider"></div>
  </div>

  <!-- sessions -->
  <div id="dash-sessions" style="display:none">
    <div class="card-title">Sessions</div>
    <div id="sess-all"></div>
    <div class="divider"></div>
  </div>

  <!-- open positions -->
  <div id="dash-open" style="display:none">
    <div class="card-title">Open Positions</div>
    <p class="caption">From active (running) sessions only.</p>
    <div id="open-all"></div>
    <div class="divider"></div>
  </div>

  <!-- trade history -->
  <div id="dash-history" style="display:none">
    <div class="card-title">Trade History</div>
    <div id="hist-all"></div>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════
// DATA LOADING
// ══════════════════════════════════════════════════════════════

const GIST_URL = 'https://gist.githubusercontent.com/KylePeiman/647660296d9b6f59377b879d655907e6/raw/data.json';

let dashData = null;
let viewMode = 'live';

function setViewMode(mode) {
  viewMode = mode;
  document.querySelectorAll('.mode-tab').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === mode);
  });
  if (dashData) renderDashboard(dashData);
}

async function loadDashboardData() {
  try {
    const resp = await fetch(GIST_URL + '?_=' + Date.now());
    if (!resp.ok) throw new Error('not found');
    dashData = await resp.json();
    renderDashboard(dashData);
  } catch (_) {
    document.getElementById('dash-banner').style.display = '';
  }
}

// ── Refresh countdown ──
let _nextRefresh = Date.now() + 30000;
function manualRefresh() { _nextRefresh = Date.now() + 30000; loadDashboardData(); }
setInterval(() => {
  const remaining = Math.max(0, Math.ceil((_nextRefresh - Date.now()) / 1000));
  document.getElementById('refresh-countdown').textContent = remaining + 's';
  if (remaining <= 0) { _nextRefresh = Date.now() + 30000; loadDashboardData(); }
}, 1000);

// ══════════════════════════════════════════════════════════════
// RENDER ORCHESTRATOR
// ══════════════════════════════════════════════════════════════

function renderDashboard(data) {
  const tsEl = document.getElementById('dash-ts');
  tsEl.textContent = 'Data as of ' + (data.generated_at || '—');
  tsEl.style.display = '';

  renderHero(data);
  renderPoolSection(data.pool_summary || []);
  renderSessionsSection(data.sessions || {});
  renderOpenSection(data.open_positions || {});
  renderHistorySection(data.trade_history || {});

  document.getElementById('dash-sessions').style.display = '';
  document.getElementById('dash-open').style.display = '';
  document.getElementById('dash-history').style.display = '';
}

// ── Portfolio hero ──
function renderHero(data) {
  const allSessions = [...(data.sessions.live || []), ...(data.sessions.sim || [])];
  const running = allSessions.filter(s => s.status === 'running');
  const totalCapital = running.reduce((s, r) => s + r.balance, 0);
  const totalPnl = allSessions.reduce((s, r) => s + r.pnl, 0);
  const allTrades = [...(data.trade_history.live || []), ...(data.trade_history.sim || [])];
  const wins = allTrades.filter(t => t.result === 'WON').length;
  const losses = allTrades.filter(t => t.result === 'LOST').length;
  const winRate = (wins + losses) > 0 ? (wins / (wins + losses) * 100) : null;
  const pnlCls = totalPnl >= 0 ? 'pos' : 'neg';

  document.getElementById('hero-metrics').innerHTML = `
    <div class="metric">
      <div class="label">Total Capital</div>
      <div class="value">$${totalCapital.toFixed(2)}</div>
      <div class="sub">${running.length} active session${running.length !== 1 ? 's' : ''}</div>
    </div>
    <div class="metric">
      <div class="label">All-time P&L</div>
      <div class="value ${pnlCls}">${totalPnl >= 0 ? '+' : ''}$${totalPnl.toFixed(4)}</div>
    </div>
    <div class="metric">
      <div class="label">Win Rate</div>
      <div class="value">${winRate !== null ? winRate.toFixed(1) + '%' : '—'}</div>
      <div class="sub">${wins}W / ${losses}L</div>
    </div>
    ${data.balance_dollars != null ? `
    <div class="metric">
      <div class="label">Kalshi Balance</div>
      <div class="value">$${data.balance_dollars.toFixed(2)}</div>
    </div>` : ''}`;

  document.getElementById('portfolio-hero').style.display = '';
}

// ── Pool summary ──
function renderPoolSection(pools) {
  if (!pools || !pools.length) { document.getElementById('dash-pools').style.display = 'none'; return; }
  const hdr = `<tr>${['Pool ID','Workers','Active','Capital ($)','P&L ($)','Trades','W / L']
    .map(h => `<th>${h}</th>`).join('')}</tr>`;
  const body = pools.map(p => {
    const pnlCls = p.pnl_dollars >= 0 ? 'pos' : 'neg';
    return `<tr>
      <td><span class="pill pill-pool">#${p.pool_id}</span></td>
      <td>${p.workers_total}</td>
      <td>${p.workers_active}</td>
      <td>$${p.value_dollars.toFixed(2)} <span style="color:var(--muted);font-size:11px">(was $${p.initial_dollars.toFixed(2)})</span></td>
      <td class="${pnlCls}">${p.pnl_dollars >= 0 ? '+' : ''}$${p.pnl_dollars.toFixed(4)}</td>
      <td>${p.total_trades}</td>
      <td>${p.won} / ${p.lost}</td>
    </tr>`;
  }).join('');
  document.getElementById('pools-all').innerHTML = `<div class="tbl-wrap"><table><thead>${hdr}</thead><tbody>${body}</tbody></table></div>`;
  document.getElementById('dash-pools').style.display = '';
}

// ── Sessions ──
function renderSessionsSection(sessions) {
  const rows = viewMode === 'live' ? (sessions.live || []) : (sessions.sim || []);
  const el = document.getElementById('sess-all');
  if (!rows.length) { el.innerHTML = noData(`No ${viewMode} sessions yet.`); return; }

  const running = rows.filter(r => r.status === 'running');
  const totalPnl = rows.reduce((s, r) => s + r.pnl, 0);
  const totalPnlCls = totalPnl >= 0 ? 'pos' : 'neg';
  const cur = running.length ? running[0] : rows[0];
  const curPnlCls = cur.pnl >= 0 ? 'pos' : 'neg';

  el.innerHTML = `
    <div class="metrics" style="margin-bottom:14px">
      <div class="metric">
        <div class="label">Active Session</div>
        <div class="value">#${cur.id}</div>
        <div class="sub">${pillStatus(cur.status)}</div>
      </div>
      <div class="metric">
        <div class="label">Balance</div>
        <div class="value">$${cur.balance.toFixed(4)}</div>
      </div>
      <div class="metric">
        <div class="label">Session P&L</div>
        <div class="value ${curPnlCls}">${cur.pnl >= 0 ? '+' : ''}$${cur.pnl.toFixed(4)}</div>
        <div class="sub ${curPnlCls}">${cur.gain_pct >= 0 ? '+' : ''}${cur.gain_pct.toFixed(2)}%</div>
      </div>
      <div class="metric">
        <div class="label">All Sessions P&L</div>
        <div class="value ${totalPnlCls}">${totalPnl >= 0 ? '+' : ''}$${totalPnl.toFixed(4)}</div>
      </div>
      <div class="metric">
        <div class="label">W / L / V</div>
        <div class="value" style="font-size:1rem">${cur.w} / ${cur.l} / ${cur.v}</div>
      </div>
    </div>
    <div class="tbl-wrap">${sessionsTable(rows)}</div>`;
}

function sessionsTable(rows) {
  const hdr = `<tr>
    <th>ID</th><th>Started</th><th>Status</th>
    <th class="hide-mobile">Pool</th>
    <th>Balance ($)</th><th>P&L ($)</th><th>Gain %</th>
    <th class="hide-mobile">Trades</th>
    <th>W</th><th>L</th>
    <th class="hide-mobile">V</th>
  </tr>`;
  const body = rows.map(r => {
    const pnlCls = r.pnl >= 0 ? 'pos' : 'neg';
    const poolCell = r.pool_id != null
      ? `<span class="pill pill-pool">#${r.pool_id}</span>`
      : `<span style="color:var(--muted)">—</span>`;
    return `<tr>
      <td>${r.id}</td>
      <td>${esc(r.started)}</td>
      <td>${pillStatus(r.status)}</td>
      <td class="hide-mobile">${poolCell}</td>
      <td>$${r.balance.toFixed(4)}</td>
      <td class="${pnlCls}">${r.pnl >= 0 ? '+' : ''}$${r.pnl.toFixed(4)}</td>
      <td class="${pnlCls}">${r.gain_pct >= 0 ? '+' : ''}${r.gain_pct.toFixed(2)}%</td>
      <td class="hide-mobile">${r.trades}</td>
      <td>${r.w}</td><td>${r.l}</td>
      <td class="hide-mobile">${r.v}</td>
    </tr>`;
  }).join('');
  return `<table><thead>${hdr}</thead><tbody>${body}</tbody></table>`;
}

// ── Open positions ──
function renderOpenSection(open) {
  const rows = viewMode === 'live' ? (open.live || []) : (open.sim || []);
  const el = document.getElementById('open-all');
  if (!rows.length) { el.innerHTML = noData(`No open ${viewMode} positions.`); return; }
  const totalCost = rows.reduce((s, r) => s + r.cost, 0);
  el.innerHTML = `
    <p class="caption">${rows.length} position${rows.length !== 1 ? 's' : ''} · $${totalCost.toFixed(4)} locked</p>
    <div class="tbl-wrap">${openTable(rows)}</div>`;
}

function openTable(rows) {
  const hdr = `<tr>
    <th>Session</th><th>Type</th><th>Event</th>
    <th class="hide-mobile">Contracts</th>
    <th>Cost ($)</th><th>Entered</th>
  </tr>`;
  const body = rows.map(r => `<tr>
    <td>${r.session}</td>
    <td>${esc(r.type)}</td>
    <td>${esc(r.event)}</td>
    <td class="hide-mobile">${r.contracts}</td>
    <td>$${r.cost.toFixed(4)}</td>
    <td>${esc(r.entered)}</td>
  </tr>`).join('');
  return `<table><thead>${hdr}</thead><tbody>${body}</tbody></table>`;
}

// ── Trade history ──
function renderHistorySection(history) {
  const rows = viewMode === 'live' ? (history.live || []) : (history.sim || []);
  renderHistoryPane(rows, 'hist-all');
}

function renderHistoryPane(arbs, containerId) {
  const el = document.getElementById(containerId);
  if (!arbs.length) { el.innerHTML = noData('No settled trades yet.'); return; }

  const wins   = arbs.filter(a => a.result === 'WON').length;
  const losses = arbs.filter(a => a.result === 'LOST').length;
  const voids  = arbs.filter(a => a.result === 'VOIDED').length;
  const totalPnl = arbs.reduce((s, a) => s + a.pnl, 0);
  const winRate = (wins + losses) > 0 ? (wins / (wins + losses) * 100) : 0;
  const pnlCls = totalPnl >= 0 ? 'pos' : 'neg';

  const typeCounts = {};
  arbs.forEach(a => { typeCounts[a.type] = (typeCounts[a.type] || 0) + 1; });
  const types = Object.keys(typeCounts);

  const cumData = [];
  let running = 0;
  [...arbs].reverse().forEach(a => { running += a.pnl; cumData.push(running); });

  const canvasId = containerId + '-pnl';
  const barCanvasId = containerId + '-bar';
  const showBar = types.length > 1;

  el.innerHTML = `
    <div class="metrics">
      <div class="metric"><div class="label">Trades</div><div class="value">${wins+losses+voids}</div></div>
      <div class="metric"><div class="label">Wins</div><div class="value pos">${wins}</div></div>
      <div class="metric"><div class="label">Losses</div><div class="value neg">${losses}</div></div>
      <div class="metric"><div class="label">Win Rate</div><div class="value">${winRate.toFixed(1)}%</div></div>
      <div class="metric"><div class="label">Total P&L</div><div class="value ${pnlCls}">${totalPnl >= 0 ? '+' : ''}$${totalPnl.toFixed(4)}</div></div>
    </div>
    <div class="chart-wrap">
      <div class="caption">Cumulative P&L ($)</div>
      <canvas id="${canvasId}" height="140"></canvas>
    </div>
    ${showBar ? `<div class="chart-wrap">
      <div class="caption">Trades by Strategy</div>
      <canvas id="${barCanvasId}" height="80"></canvas>
    </div>` : ''}
    <div class="divider"></div>
    <div class="tbl-wrap">${historyTable(arbs, containerId)}</div>`;

  requestAnimationFrame(() => {
    drawLineChart(document.getElementById(canvasId), cumData);
    if (showBar) drawBarChart(document.getElementById(barCanvasId), types, types.map(t => typeCounts[t]));
  });

  el.querySelectorAll('.trade-row').forEach(row => {
    row.addEventListener('click', () => {
      const detailEl = document.getElementById(row.dataset.detail);
      const isOpen = row.classList.toggle('open');
      detailEl.style.display = isOpen ? '' : 'none';
    });
  });
}

function historyTable(arbs, baseId) {
  const hdr = `<tr>
    <th></th>
    <th>Result</th><th>Type</th><th>Event</th>
    <th class="hide-mobile">Contracts</th>
    <th>Cost ($)</th><th>P&L ($)</th>
    <th class="hide-mobile">ROI %</th>
    <th>Settled</th>
  </tr>`;
  const body = arbs.map((a, i) => {
    const rid = baseId + '-d' + i;
    const resultCls = { WON: 'pos', LOST: 'neg', VOIDED: 'neutral' }[a.result] || '';
    const pnlCls = a.pnl >= 0 ? 'pos' : 'neg';
    const roiCls = a.roi >= 0 ? 'pos' : 'neg';
    const legHtml = (a.legs && a.legs.length)
      ? `<div class="trade-detail-inner"><table>
          <thead><tr>${['Ticker','Side','Entry ¢','Contracts','Result','P&L ($)'].map(h=>`<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${a.legs.map(l => `<tr>
            <td>${esc(l.ticker)}</td>
            <td>${esc(l.side)}</td>
            <td>${l.entry_cents}</td>
            <td>${l.contracts}</td>
            <td class="${{WON:'pos',LOST:'neg',VOIDED:'neutral'}[l.result]||''}">${esc(l.result)}</td>
            <td class="${l.pnl>=0?'pos':'neg'}">${l.pnl>=0?'+':''}$${l.pnl.toFixed(4)}</td>
          </tr>`).join('')}</tbody>
        </table></div>`
      : `<div class="trade-detail-inner" style="color:var(--muted);font-size:12px">No leg detail.</div>`;

    return `
      <tr class="trade-row" data-detail="${rid}">
        <td><span class="expand-icon">▶</span></td>
        <td class="${resultCls}">${pillResult(a.result)}</td>
        <td>${esc(a.type)}</td>
        <td title="${esc(a.event)}">${esc(a.event.length>45 ? a.event.slice(0,45)+'…' : a.event)}</td>
        <td class="hide-mobile">${a.contracts}</td>
        <td>$${a.cost.toFixed(4)}</td>
        <td class="${pnlCls}">${a.pnl>=0?'+':''}$${a.pnl.toFixed(4)}</td>
        <td class="${roiCls} hide-mobile">${a.roi>=0?'+':''}${a.roi.toFixed(2)}%</td>
        <td>${esc(a.settled)}</td>
      </tr>
      <tr class="trade-detail" id="${rid}" style="display:none">
        <td colspan="9">${legHtml}</td>
      </tr>`;
  }).join('');
  return `<table><thead>${hdr}</thead><tbody>${body}</tbody></table>`;
}

// ══════════════════════════════════════════════════════════════
// CANVAS CHARTS
// ══════════════════════════════════════════════════════════════

function drawLineChart(canvas, data) {
  if (!canvas || !data.length) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth || 800;
  const H = parseInt(canvas.getAttribute('height')) || 140;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { t: 12, r: 12, b: 24, l: 52 };
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;
  const mn = Math.min(0, ...data);
  const mx = Math.max(0, ...data);
  const range = mx - mn || 1;

  function xp(i) { return pad.l + (i / (data.length - 1 || 1)) * cw; }
  function yp(v) { return pad.t + ch - ((v - mn) / range) * ch; }

  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  [0.0, 0.25, 0.5, 0.75, 1.0].forEach(t => {
    const y = pad.t + t * ch;
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(pad.l + cw, y); ctx.stroke();
    const v = mx - t * range;
    ctx.fillStyle = 'rgba(125,133,144,0.8)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText((v >= 0 ? '+' : '') + '$' + v.toFixed(3), pad.l - 4, y + 3);
  });

  const zeroY = yp(0);
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.moveTo(pad.l, zeroY); ctx.lineTo(pad.l + cw, zeroY); ctx.stroke();
  ctx.setLineDash([]);

  const lastVal = data[data.length - 1];
  const fillColor = lastVal >= 0 ? 'rgba(63,185,80,' : 'rgba(248,81,73,';
  const grad = ctx.createLinearGradient(0, pad.t, 0, pad.t + ch);
  grad.addColorStop(0, fillColor + '0.25)');
  grad.addColorStop(1, fillColor + '0.02)');
  ctx.beginPath();
  ctx.moveTo(xp(0), yp(data[0]));
  data.forEach((v, i) => { if (i > 0) ctx.lineTo(xp(i), yp(v)); });
  ctx.lineTo(xp(data.length - 1), yp(0));
  ctx.lineTo(xp(0), yp(0));
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(xp(0), yp(data[0]));
  data.forEach((v, i) => { if (i > 0) ctx.lineTo(xp(i), yp(v)); });
  ctx.strokeStyle = lastVal >= 0 ? '#3fb950' : '#f85149';
  ctx.lineWidth = 2;
  ctx.lineJoin = 'round';
  ctx.stroke();
}

function drawBarChart(canvas, labels, values) {
  if (!canvas || !labels.length) return;
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth || 800;
  const H = parseInt(canvas.getAttribute('height')) || 80;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const pad = { t: 8, r: 12, b: 8, l: 100 };
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b;
  const maxVal = Math.max(...values) || 1;
  const barH = Math.min(18, (ch / labels.length) - 4);
  const gap  = (ch - labels.length * barH) / (labels.length + 1);

  labels.forEach((lbl, i) => {
    const y = pad.t + gap + i * (barH + gap);
    const bw = (values[i] / maxVal) * cw;
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath();
    ctx.roundRect(pad.l, y, bw, barH, 3);
    ctx.fill();
    ctx.fillStyle = 'rgba(125,133,144,0.9)';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(lbl, pad.l - 6, y + barH / 2 + 4);
    ctx.fillStyle = 'rgba(230,237,243,0.8)';
    ctx.textAlign = 'left';
    ctx.fillText(values[i], pad.l + bw + 6, y + barH / 2 + 4);
  });
}

// HELPERS
// ══════════════════════════════════════════════════════════════
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function noData(msg) {
  return `<div class="no-data">${esc(msg)}</div>`;
}
function pillStatus(s) {
  const map = { running: 'pill-running', stopped: 'pill-stopped' };
  return `<span class="pill ${map[s]||'pill-stopped'}">${esc(s)}</span>`;
}
function pillResult(r) {
  const map = { WON: 'pill-won', LOST: 'pill-lost', VOIDED: 'pill-voided' };
  return `<span class="pill ${map[r]||''}">${esc(r)}</span>`;
}
